security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AdminAuthenticator
            logout:
                path: app_logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    role_hierarchy:
        # Un bibliothécaire peut accéder au front-office comme un internaute
        ROLE_BIBLIOTHECAIRE: ROLE_ADHERENT
        # Un responsable peut accéder au front-office comme un internaute et hérite de toutes les fonctionnalités du bibliothécaire
        ROLE_RESPONSABLE: ROLE_BIBLIOTHECAIRE

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: [ROLE_BIBLIOTHECAIRE, ROLE_RESPONSABLE] }
        - { path: ^/api/user/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/emprunts, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/reservations, roles: IS_AUTHENTICATED_FULLY }










